name: Replace Dev URLs with PRD URLs on Carga Archivo REP4 CFE FLASK

on:
  pull_request:
    types: [closed]
    branches:
      - main

# Necesario para poder hacer push directo a main
permissions:
  contents: write

jobs:
  replace-urls:
    # Clave: solo correr si el PR realmente se mergeó (no si se cerró sin mergear)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main          # Fuerza a pararse en main real, no en el merge commit de prueba del PR
          fetch-depth: 0

      - name: Detect manifest file (manifest.yml o mainfest.yml)
        id: mf
        run: |
          if [ -f "manifest.yml" ]; then
            echo "file=manifest.yml" >> "$GITHUB_OUTPUT"
          elif [ -f "mainfest.yml" ]; then
            echo "file=mainfest.yml" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No se encontró manifest.yml ni mainfest.yml en la raíz del repo"
            exit 1
          fi

      - name: Verify app.py exists
        run: |
          if [ ! -f "app.py" ]; then
            echo "::error::No se encontró app.py en la raíz del repo. Archivos app.py en el repo:"
            find . -name "app.py"
            exit 1
          fi

      - name: Replace DEV → PRD in app.py
        run: |
          # Cero referencias DEV es válido si el archivo ya está en PRD.
          BEFORE=$(grep -c "telcl-dev-db-cap" app.py || true)
          echo "Ocurrencias de 'telcl-dev-db-cap' encontradas en app.py: $BEFORE"

          if [ "$BEFORE" -eq 0 ]; then
            if grep -q "telcl-prd-db-cap" app.py; then
              echo "app.py ya contiene URLs PRD; no requiere reemplazos."
            else
              echo "::error::No se encontró el patrón DEV ni PRD esperado en app.py."
              exit 1
            fi
          fi

          sed -i 's/telcl-dev-db-cap/telcl-prd-db-cap/g' app.py

          # Validar que efectivamente ya no queden referencias a dev
          AFTER=$(grep -c "telcl-dev-db-cap" app.py || true)
          if [ "$AFTER" -ne 0 ]; then
            echo "::error::Quedaron $AFTER referencias a 'telcl-dev-db-cap' en app.py después del reemplazo"
            exit 1
          fi

          echo "app.py: $BEFORE referencia(s) reemplazada(s) correctamente"

      - name: Replace DEV → PRD in manifest
        run: |
          MF="${{ steps.mf.outputs.file }}"

          BEFORE_APP=$(grep -c "carga-archivo-REP4-clean-DEV" "$MF" || true)
          BEFORE_ENV=$(grep -Ec "ENVIRONMENT:[[:space:]]*dev" "$MF" || true)
          BEFORE_URL=$(grep -c "telcl-dev-db-cap" "$MF" || true)

          echo "Ocurrencias encontradas en $MF -> nombre app: $BEFORE_APP, ENVIRONMENT: $BEFORE_ENV, URLs: $BEFORE_URL"

          if [ "$BEFORE_APP" -eq 0 ] && [ "$BEFORE_ENV" -eq 0 ] && [ "$BEFORE_URL" -eq 0 ]; then
            echo "$MF no contiene patrones DEV; se verificará la configuración PRD."
          fi

          sed -i 's/carga-archivo-REP4-clean-DEV/carga-archivo-REP4-clean-PRD/g' "$MF"
          sed -i 's/ENVIRONMENT:[[:space:]]*dev/ENVIRONMENT: prd/g' "$MF"
          sed -i 's/telcl-dev-db-cap/telcl-prd-db-cap/g' "$MF"

          # Validar que no haya quedado nada en dev
          AFTER=$(grep -Ec "telcl-dev-db-cap|carga-archivo-REP4-clean-DEV|ENVIRONMENT:[[:space:]]*dev" "$MF" || true)
          if [ "$AFTER" -ne 0 ]; then
            echo "::error::Quedaron $AFTER referencias DEV en $MF después del reemplazo"
            exit 1
          fi

          if ! grep -q "carga-archivo-REP4-clean-PRD" "$MF" || ! grep -Eq "ENVIRONMENT:[[:space:]]*prd" "$MF"; then
            echo "::error::No se encontró el nombre de app PRD o ENVIRONMENT: prd en $MF."
            exit 1
          fi

          echo "✅ $MF actualizado correctamente"

      - name: Replace process hub DEV → PRD
        run: |
          DEV_BASE='https://tlcl-processes-hub.cfapps.us10.hana.ondemand.com/'
          PRD_BASE='https://tlcl-processes-hub-prd.cfapps.us10.hana.ondemand.com/'
          MF="${{ steps.mf.outputs.file }}"

          if ! grep -Fq "$DEV_BASE" app.py && ! grep -Fq "$PRD_BASE" app.py; then
            echo "::error::No se encontró la URL esperada del hub de procesos en app.py."
            exit 1
          fi

          # Conservar la ruta del endpoint y actualizar también overrides del manifest.
          for FILE in app.py "$MF"; do
            BEFORE=$(grep -Fc "$DEV_BASE" "$FILE" || true)
            sed -i 's|https://tlcl-processes-hub\.cfapps\.us10\.hana\.ondemand\.com/|https://tlcl-processes-hub-prd.cfapps.us10.hana.ondemand.com/|g' "$FILE"
            if grep -Fq "$DEV_BASE" "$FILE"; then
              echo "::error::Quedaron URLs del hub DEV en $FILE."
              exit 1
            fi
            echo "$FILE: $BEFORE referencia(s) del hub DEV reemplazada(s)."
          done

          if ! grep -Fq "$PRD_BASE" app.py; then
            echo "::error::No se encontró la URL del hub PRD en app.py."
            exit 1
          fi

      - name: Show diff for review
        run: |
          echo "----- DIFF -----"
          git diff --stat
          git diff

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add -- app.py "${{ steps.mf.outputs.file }}"

          if git diff --staged --quiet; then
            echo "Sin cambios: la configuración ya está en PRD."
            exit 0
          fi

          git commit -m "[Automated] Replaced DEV URLs with PRD URLs"
          git push origin HEAD:main
