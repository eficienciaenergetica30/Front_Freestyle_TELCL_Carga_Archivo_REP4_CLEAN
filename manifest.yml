applications:
  - name: carga-archivo-REP4-clean-PRD
    memory: 1G
    buildpack: https://github.com/cloudfoundry/python-buildpack.git#v1.8.4
    command: gunicorn --worker-class eventlet -w 1 app:app --bind 0.0.0.0:$PORT --timeout 120
    health-check-type: http
    health-check-http-endpoint: /health
    env:
      FLASK_ENV: production
      ENVIRONMENT: prd
      PYTHONUNBUFFERED: "true"
      HTTP_TIMEOUT: "90"


